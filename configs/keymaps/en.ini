; en.ini - English: the keymap built in libinput (US letters, digits, punctuation, shift; the sym layer of a small keyboard), so there
; is nothing to put over it. The file is here so that English is on the list of the languages of a system (a .dmd file picks the
; keymaps it ships with "libinput keymap=en.ini"), and a screen that lists /cfg/keymaps/libinput finds it next to the others.
; libinput_keymap_set_language("en") does not need it; loading it by hand changes nothing.
[modifiers]
shift=0xE1, 0xE5
