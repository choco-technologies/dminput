; numeric - a keypad: the digits, the point and the four operations (USB HID usages of the keypad: 0x54..0x63). No modifiers, no layers;
; Enter (0x58) gives no character, the application gets its code.

[base]
0x54=/
0x55=*
0x56=-
0x57=+
0x59=1
0x5A=2
0x5B=3
0x5C=4
0x5D=5
0x5E=6
0x5F=7
0x60=8
0x61=9
0x62=0
0x63=.
