; inputd@.ini - libsystemd unit template, one instance per input device.
;
; Not started on its own: dmdevfs reports every node that answers
; DMDRVI_IOCTL_INPUT_GET_INFO as an "input" class device, and inputd.rules
; maps that class here, so libsystemd instantiates inputd@<name> for each.
;
; %i is the device's name (its node name, e.g. "touch"), %v its node path ("/dev/touch").
; The keymap of keyboards: the language of the environment variable LANG (docs/keymap.md); English without it.
description=inputd on input device %i
exec=inputd
args=%i %v
type=simple
