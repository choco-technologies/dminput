name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear the dmf-get cache
        run: |
          # The image may carry manifests cached before the versions it needs
          dmf-get --clear-cache

      - name: Build libinput and inputd
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          ls -lh build/dmf/
          test -f build/dmf/libinput.dmf
          test -f build/dmf/libinput_version.txt
          test -f build/dmf/inputd.dmf
          test -f build/dmf/test_libinput.dmf

      - name: Run the tests with dmod_loader
        run: |
          cd build
          export DMOD_DMF_DIR=$(pwd)/dmf
          dmf-get install -d dmf/test_libinput-local.dmd -y
          dmod_loader dmf/test_libinput.dmf
