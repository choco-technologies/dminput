; a layout of a small keyboard for the tests (the real one of the T-Deck Pro is a file of dmtca8418)
; compact - a small keyboard with letters, digits on the sym layer and no AltGr (the T-Deck Pro, a phone-like QWERTY).
; A layout says which keys the keyboard has and how they behave; the language (keymaps/<language>.ini) comes on top of it.
; The keys with no USB code have the codes of dmdrvi: SYM 0x100, MIC 0x101, DOLLAR 0x102 (write ; and # as code points: they begin a comment).
;
; shift, alt and sym are STICKY: a tap arms the modifier for the next key only (sym, then N gives a comma); held, it acts as long as it is
; held. Two taps of shift lock the capital letters (caps), a third unlocks. The characters printed on the keys are the sym layer.

[modifiers]
shift=0xE1, 0xE5
alt=0xE2
sym=0x100
sticky=shift, alt, sym
lock=shift

[base]
0x102=$

[sym]
Q=U+0023
W=1
E=2
R=3
T=U+0028
Y=U+0029
U=_
I=-
O=+
P=@
A=*
S=4
D=5
F=6
G=/
H=:
J=U+003B
K=U+0027
L=U+0022
Z=7
X=8
C=9
V=?
B=!
N=,
M=.
0x101=0
