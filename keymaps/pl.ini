; pl.ini - Polish letters on the alt layer (alt + the letter), over the built in US layers.
; Loaded when LANG is pl (pl_PL.UTF-8), or by libinput_keymap_load(). See docs/keymap.md.
;
; The alt key is the one of the built in keymap (left alt, 0xE2) and a tap of it works for one letter (a keyboard without AltGr).
[alt]
A=ą
C=ć
E=ę
L=ł
N=ń
O=ó
S=ś
X=ź
Z=ż

[alt+shift]
A=Ą
C=Ć
E=Ę
L=Ł
N=Ń
O=Ó
S=Ś
X=Ź
Z=Ż
