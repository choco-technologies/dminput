; pl.ini - Polish letters on the alt layer (alt + the letter), over the built in US layers.
; Load: DMINPUT_KEYMAP=<this file>, or libinput_keymap_load(). See docs/keymap.md.
;
; The alt key is the one of the [modifiers] section (the built in keymap: left alt, 0xE2); to make a tap of
; it work for one letter (a keyboard without AltGr), add:
;
;   [modifiers]
;   sticky=alt
[alt]
A=ą
C=ć
E=ę
L=ł
N=ń
O=ó
S=ś
X=ź
Z=ż

[alt+shift]
A=Ą
C=Ć
E=Ę
L=Ł
N=Ń
O=Ó
S=Ś
X=Ź
Z=Ż
